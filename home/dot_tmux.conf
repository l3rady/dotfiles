# Managed by chezmoi (home/dot_tmux.conf).
# Reload with: prefix + r

# Use apt's zsh (matches run_once_after_90-set-login-shell.sh)
set -g default-shell /usr/bin/zsh

# 256-color and 24-bit truecolor support for modern terminals
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,xterm-kitty:RGB,wezterm:RGB"

# Mouse support (scroll, select panes, resize borders) and generous scrollback
set -g mouse on
set -g history-limit 50000

# Responsive Esc key and focus reporting for TUI apps (claude, codex, agy, k9s)
set -sg escape-time 10
set -g focus-events on

# Forward clipboard writes to the outer terminal over SSH (OSC 52)
set -g set-clipboard on

# 1-based indexing and automatic window renumbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive splits and new windows in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (prefix + h/j/k/l, alongside default arrow keys)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resizing (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload configuration quickly
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Minimal status bar
set -g status-interval 5
set -g status-style "bg=default,fg=colour248"
set -g status-left-length 30
set -g status-left "#[bold][#S] #[nobold]"
set -g status-right "#H %Y-%m-%d %H:%M"
setw -g window-status-current-style "bold,fg=colour75"
