# Locale for the shell (LANG, LC_ALL, LANGUAGE). Generated by the install script.
locale: en_GB.UTF-8

# Userspace OOM killer (/etc/default/earlyoom). Triggers strictly on available
# RAM (-s 100,100 ignores swap) so runaway processes are killed before thrashing
# disk. Keep the --avoid regex free of spaces and inner quotes because systemd
# splits $EARLYOOM_ARGS without shell quote stripping.
earlyoom:
  args: "-m 5,2 -s 100,100 -r 3600 --avoid ^(systemd|sshd|zsh|bash|tmux|dockerd|containerd)$"

# Systemd slice capping all Docker containers combined (/etc/docker/daemon.json
# cgroup-parent + /etc/systemd/system/docker-containers.slice). Percentages
# scale across WSL and smaller Ubuntu VMs.
docker_slice:
  name: docker-containers.slice
  memory_high: "70%"
  memory_max: "75%"
  memory_swap_max: "0"
