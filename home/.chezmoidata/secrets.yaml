# Environment variables filled from Bitwarden and exported by every zsh shell
# (via ~/.config/zsh/secrets.zsh, mode 600). The repo holds only the item names;
# values are fetched by `chezmoi apply` while the vault is unlocked.
#
# To add one: create a Bitwarden Secure note with the value as its note text
# (or a Login with it in the Password field), add an entry here, then unlock,
# sync and apply (`bw sync` fetches items created in the app or web vault):
#   export BW_SESSION="$(bw unlock --raw)" && bw sync && chezmoi apply
secretEnv:
  - name: UNIFI_API_KEY        # UniFi Network Integration API (read-only key), for homelab docs
    item: "UniFi API Key"
