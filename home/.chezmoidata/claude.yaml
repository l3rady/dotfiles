# Claude Code settings managed by chezmoi. These keys are set in
# ~/.claude/settings.json on every `chezmoi apply`; any other keys (for example
# hooks that plugins add) are left alone. To keep a setting you changed in
# Claude Code (/config), copy it here.
claude:
  settings:
    # Opus makes the decisions; the implementer subagent runs on Sonnet
    # (agents in dot_claude/agents/).
    model: opus
    modelSettings:
      claude-opus-5-5:
        effortLevel: medium
      claude-sonnet-5-5:
        effortLevel: medium
    # No Co-Authored-By trailer, PR byline or session link. The object form,
    # not `attribution: false`, so Claude Code before v2.1.281 still reads the file.
    attribution:
      commit: ""
      pr: ""
      sessionUrl: false
    theme: dark
    preferredNotifChannel: auto
    inputNeededNotifEnabled: true
    agentPushNotifEnabled: true
  # Skill packs that only a subagent reads, kept out of ~/.claude/skills so the
  # main session never loads them. Downloaded by .chezmoiexternal.toml.tmpl into
  # ~/.claude/agent-skills/<name>/. To upgrade: read the upstream diff between the
  # old and new commit (these files become agent instructions), then change the
  # commit and the sha256 of https://github.com/<repo>/archive/<commit>.tar.gz.
  agentSkills:
    wordpress-security:
      repo: wpultimatesecurity/WordPress-Security-Skills
      commit: a0ba3ab3d524f033e2c985a771f22577b6f4bda8
      sha256: d9df4b04ab0328454bbea2f41e546b7c66a27ab106226047045c6f085afc60ab
