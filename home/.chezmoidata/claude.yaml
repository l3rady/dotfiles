# Claude Code settings managed by chezmoi. These keys are set in
# ~/.claude/settings.json on every `chezmoi apply`; any other keys (for example
# hooks that plugins add) are left alone. To keep a setting you changed in
# Claude Code (/config), copy it here.
claude:
  settings:
    # Opus makes the decisions; the implementer subagent runs on Sonnet
    # (agents in dot_claude/agents/).
    model: opus
    modelSettings:
      claude-opus-5-5:
        effortLevel: medium
      claude-sonnet-5-5:
        effortLevel: medium
    # No Co-Authored-By trailer, PR byline or session link. The object form,
    # not `attribution: false`, so Claude Code before v2.1.281 still reads the file.
    attribution:
      commit: ""
      pr: ""
      sessionUrl: false
    theme: dark
    preferredNotifChannel: auto
    inputNeededNotifEnabled: true
    agentPushNotifEnabled: true
    # Merged into settings.json (see modify_settings.json.tmpl), preserving any
    # machine-local or plugin-added env keys. Leading ~/ is expanded per host.
    env:
      CLAUDE_CODE_SHELL: "/usr/bin/bash"
      CLAUDE_ENV_FILE: "~/.config/shell/env.sh"
    # Merged into the hooks already in settings.json (see modify_settings.json.tmpl), so
    # hooks that plugins add are kept. Blocks a push whose commits have a first line
    # over 72 characters, which commitlint rejects in CI.
    hooks:
      PreToolUse:
        - matcher: Bash
          hooks:
            - type: command
              command: ~/.claude/hooks/check-commit-headers.sh
