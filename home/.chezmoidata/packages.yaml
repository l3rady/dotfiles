# Package lists. Edit, commit, then run `chezmoi apply` and the
# install script re-runs automatically because its contents changed.
packages:
  # Third-party Homebrew taps. Homebrew only loads formulae from taps you
  # have trusted, so every tap used below (owner/tap/name) must be listed here.
  taps:
    - jesseduffield/lazydocker

  # Installed with Homebrew on Linux. Preferred for everything brew has.
  brew:
    # core tools
    - chezmoi
    - starship
    - gh
    - git
    - git-lfs
    - git-sizer
    - git-filter-repo
    - git-svn
    - gitleaks
    - gnupg              # provides gpg
    - grep
    - gzip
    - zip
    - unzip
    - sevenzip
    - wget
    - file-formula
    - dos2unix
    - socat
    - tmux
    - mosh
    - htop
    - ncdu
    - bat
    - fzf
    - ripgrep            # provides rg (used by Claude Code subagents)
    - zoxide
    - chroma             # for the colorize zsh plugin
    - jq
    - yq
    - sqlite             # provides sqlite3
    # secrets
    - bitwarden-cli      # provides bw
    - sops
    - age
    # languages and runtimes
    - uv
    - mise               # runtime versions (Node, Terraform); replaces Volta and tfenv
    # cloud and kubernetes
    - awscli
    - ansible
    - kubernetes-cli     # provides kubectl
    - helm
    - k9s
    - cilium-cli         # provides cilium (status, connectivity tests)
    - hubble             # network flow observability for Cilium
    - prometheus         # provides promtool (rule unit tests, config checks)
    - terraform-docs
    - terragrunt
    - tfsort
    - trivy
    - ratchet
    # containers
    - jesseduffield/lazydocker/lazydocker
    # data and documents
    - csvkit
    - exiftool
    - graphviz
    - imagemagick
    - ocrmypdf
    - pandoc
    - poppler
    - pgloader
    # AI coding tools
    - herdr

  # Homebrew casks (tested working on Linux with Homebrew 7).
  casks:
    - azure-cli          # moved from homebrew/core to a cask
    - antigravity-cli    # provides agy (Google Antigravity); not on npm, so `brew upgrade` updates it

  # Installed globally with mise (brew's mise, above) after brew. Each entry is
  # a mise tool spec, written to ~/.config/mise/config.toml by `mise use --global`.
  mise:
    - node@lts           # latest Node LTS
    - terraform@latest   # default; a project's .terraform-version overrides it

  # Global npm packages, installed with `npm install -g` into mise's Node after
  # it's installed. A plain npm install (not mise's npm: backend) lets tools
  # update themselves, e.g. `claude update`. Also written to
  # ~/.default-npm-packages, so mise reinstalls them into each new Node version.
  npm:
    - "@anthropic-ai/claude-code" # provides claude
    - "@openai/codex"    # provides codex
    - t3                 # T3 Code (pingdotgg/t3code)
    - skills             # npx skills: install agent skills (vercel-labs/skills)

  # Installed with apt. Only for things brew doesn't carry
  # or that must be system packages.
  apt:
    # Homebrew's own prerequisites (installed before Homebrew)
    - build-essential
    - procps
    - curl
    - file
    - git
    # System packages
    - locales            # locale-gen, for the locale in system.yaml
    - zsh                # login shell has to be in /etc/shells
    - cifs-utils         # kernel mount helper for SMB shares
    - python-is-python3
    - command-not-found  # handler for the command-not-found zsh plugin
    - earlyoom           # userspace OOM killer (stops runaway processes before swap thrashing)

  # Installed with apt from Docker's own repository (added automatically).
  docker:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

# Deliberately not listed:
# - zsh-autosuggestions, zsh-syntax-highlighting: loaded as oh-my-zsh plugins (zsh.yaml)
# - vscode-server: VS Code installs it itself the first time you run `code .` in WSL
