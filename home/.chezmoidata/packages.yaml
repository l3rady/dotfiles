# Package lists. Edit, commit, then run `chezmoi apply` and the
# install script re-runs automatically because its contents changed.
packages:
  # Third-party Homebrew taps. Homebrew only loads formulae from taps you
  # have trusted, so every tap used below (owner/tap/name) must be listed here.
  taps:
    - jesseduffield/lazydocker
    - anomalyco/tap

  # Installed with Homebrew on Linux. Preferred for everything brew has.
  brew:
    # core tools
    - chezmoi
    - starship
    - gh
    - git
    - git-lfs
    - git-sizer
    - git-filter-repo
    - git-svn
    - gitleaks
    - gnupg              # provides gpg
    - grep
    - gzip
    - zip
    - unzip
    - sevenzip
    - wget
    - file-formula
    - dos2unix
    - socat
    - xsel
    - htop
    - ncdu
    - bat
    - fzf
    - zoxide
    - chroma             # for the colorize zsh plugin
    - jq
    - yq
    - sqlite             # provides sqlite3
    # secrets
    - bitwarden-cli      # provides bw
    - sops
    - age
    - stow
    # languages and runtimes
    - uv
    - volta
    - tfenv
    # cloud and kubernetes
    - awscli
    - ansible
    - azure-cli
    - kubernetes-cli     # provides kubectl
    - k9s
    - terraform-docs
    - terragrunt
    - tfsort
    - trivy
    - ratchet
    # containers
    - jesseduffield/lazydocker/lazydocker
    # data and documents
    - csvkit
    - exiftool
    - graphviz
    - imagemagick
    - ocrmypdf
    - pandoc
    - poppler
    - pgloader
    # AI coding tools
    - anomalyco/tap/opencode
    - herdr

  # Homebrew casks (tested working on Linux with Homebrew 7).
  casks:
    - codex
    - claude-code@latest # tracks the latest release; claude-code is the stable channel

  # Installed with apt. Only for things brew doesn't carry
  # or that must be system packages.
  apt:
    # Homebrew's own prerequisites (installed before Homebrew)
    - build-essential
    - procps
    - curl
    - file
    - git
    # System packages
    - locales            # locale-gen, for the locale in system.yaml
    - zsh                # login shell has to be in /etc/shells
    - cifs-utils         # kernel mount helper for SMB shares
    - python-is-python3
    - command-not-found  # handler for the command-not-found zsh plugin

  # Installed with apt from Docker's own repository (added automatically).
  docker:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin

# Deliberately not listed:
# - zsh-autosuggestions, zsh-syntax-highlighting: loaded as oh-my-zsh plugins (zsh.yaml)
# - vscode-server: VS Code installs it itself the first time you run `code .` in WSL
