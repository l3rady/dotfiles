"$schema" = 'https://starship.rs/config-schema.json'

# Starting point; see https://starship.rs/config/ or try a preset:
#   starship preset nerd-font-symbols -o ~/.config/starship.toml
# then copy the result back with `chezmoi add ~/.config/starship.toml`.
add_newline = true

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
